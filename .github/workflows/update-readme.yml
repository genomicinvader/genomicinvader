name: Update Profile Stats
on:
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours (at minute 0)
  workflow_dispatch:         # Allow manual triggers

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Stats
        run: |
          # Customize this section with your stats tools
          echo "### My GitHub Stats" > new_readme.md
          echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> new_readme.md
          echo "![GitHub Stats](https://github-readme-stats.vercel.app/api?username=$GITHUB_ACTOR&show_icons=true)" >> new_readme.md
          # Add more stats (e.g., languages, streaks, WakaTime, etc.)

      - name: Commit Changes (If Updated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Auto-generated token (no PAT needed)
        run: |
          if ! cmp -s README.md new_readme.md; then
            mv new_readme.md README.md
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add README.md
            git commit -m "Update stats: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          else
            echo "No changes detected."
          fi
